<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBER_D3VIL CALC</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000000;--card:#000000;--ink:#7dffa0;--mut:#3fae5e;--line:#14602a;--fld:#000000;--key:#07140a;--op:#0a2a12;--opi:#00ff41;--lcd:#021a0a;--lcdi:#00ff41;--acc:#00ff41;--on:#000000;--accs:#032410;--bad:#ff2e4d;--bads:#2a0510}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.calc{width:100%;max-width:360px;background:var(--card);border-radius:28px;padding:18px;box-shadow:0 2px 0 rgba(255,255,255,.45) inset,0 28px 50px -24px rgba(0,0,0,.45)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;margin:2px 4px 14px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em}
.disp{background:var(--lcd);color:var(--lcdi);border-radius:14px;padding:12px 14px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;margin-bottom:16px;overflow:hidden;box-shadow:inset 0 3px 8px rgba(0,0,0,.28)}
.ex,.rs,.eqn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ex{font-size:32px;line-height:1.15;font-weight:600;text-align:right;overflow-wrap:anywhere}
.rs{font-size:18px;min-height:24px;margin-top:6px;opacity:.8}
.bl{filter:blur(6px);user-select:none}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.k{height:56px;border:0;border-radius:14px;background:var(--key);color:var(--ink);font-size:22px;font-weight:600;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.k.o{background:var(--op);color:var(--opi)}
.k.c{color:var(--bad)}
.k.eq{grid-column:span 4;background:var(--acc);color:var(--on);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:sh .35s}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.k{transition:none}}
.ov{position:fixed;top:0;bottom:0;left:0;right:0;background:rgba(8,10,8,.62);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ov[hidden]{display:none}
.sheet{position:relative;margin:auto;width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:24px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--line);font-size:20px;line-height:1}
h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.sub{margin:0 0 16px;color:var(--mut);font-size:14px}
.eqn{background:var(--lcd);color:var(--lcdi);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:18px;overflow-wrap:anywhere}
.plan{display:block;width:100%;text-align:left;background:var(--fld);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;position:relative}
.plan:hover{border-color:var(--acc)}
.plan.pro{border-color:var(--acc);background:var(--accs);margin-top:20px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan b{font-size:17px}
.pr{font-size:22px;font-weight:800;letter-spacing:-.02em}
.plan small{display:block;margin-top:2px;color:var(--mut);font-size:13px}
.badge{position:absolute;top:-11px;left:14px;background:var(--acc);color:var(--on);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.fine{margin:10px 0 0;color:var(--mut);font-size:12px;text-align:center}
.back{background:none;border:0;padding:0;margin-bottom:12px;color:var(--mut);font-size:14px}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--fld);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 16px;font-size:14px}
.dec{display:flex;gap:10px;background:var(--bads);color:var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.dec[hidden]{display:none}
.dec b{display:block;font-size:15px}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
.f{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--fld);color:var(--ink);padding:0 12px;font:inherit}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.bad input{border-color:var(--bad)}
.err{margin-top:4px;color:var(--bad);font-size:12px}
.cn{position:relative}
.cn i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;font-size:12px;color:var(--mut)}
.pay{width:100%;height:50px;border:0;border-radius:14px;background:var(--acc);color:var(--on);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.pay[disabled]{opacity:.75;cursor:wait}
.sp{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.calc{box-shadow:0 0 0 1px var(--line),0 0 36px -10px rgba(0,255,65,.45)}
.sheet{border:1px solid var(--line);box-shadow:0 0 40px -12px rgba(0,255,65,.4)}
.logo{font-size:18px;letter-spacing:.04em;color:var(--acc);text-shadow:0 0 10px rgba(0,255,65,.6)}
.ex,.rs{text-shadow:0 0 8px rgba(0,255,65,.55)}
.k.eq{box-shadow:0 3px 0 #008a22}
</style>
</head>
<body>
<main class="calc">
  <div class="top"><div class="logo">CYBER_D3VIL CALC</div></div>
  <div class="disp" id="disp"><div class="ex" id="ex">0</div><div class="rs" id="rs"></div></div>
  <div class="pad" id="pad"></div>
</main>

<div class="ov" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pt">
    <button class="x" id="x" type="button" aria-label="Close">×</button>

    <section id="v1">
      <h2 id="pt">Your answer is ready 🔒</h2>
      <p class="sub">Choose a plan to reveal it.</p>
      <div class="eqn" id="eqn"></div>
      <button class="plan" data-p="one" type="button"><span class="row"><b>One-time answer</b><span class="pr">$19.99</span></span><small>Reveals this single answer. The next equation costs extra.</small></button>
      <button class="plan pro" data-p="pro" type="button"><span class="badge">Best value</span><span class="row"><b>CYBER_D3VIL Pro</b><span class="pr">$299.99</span></span><small>Unlimited answers, crisp digits, priority addition.</small></button>
      <p class="fine">Prices in USD. No refunds on math.</p>
    </section>

    <section id="v2" hidden>
      <button class="back" id="back" type="button">Back to plans</button>
      <h2>Checkout</h2>
      <div class="sum"><span id="item"></span><b id="amt"></b></div>
      <div class="dec" id="dec" role="alert" hidden><span>⚠️</span><div><b>Payment declined</b><span id="dect"></span></div></div>
      <form id="f" novalidate>
        <div class="f"><label for="em">Email</label><input id="em" type="email" inputmode="email" placeholder="you@example.com" autocomplete="off"><div class="err" id="e-em"></div></div>
        <div class="f"><label for="cc">Card information</label><div class="cn"><input id="cc" inputmode="numeric" placeholder="1234 1234 1234 1234" autocomplete="off"><i id="brand"></i></div><div class="err" id="e-cc"></div></div>
        <div class="g2">
          <div class="f"><label for="xp">Expiry</label><input id="xp" inputmode="numeric" placeholder="MM / YY" autocomplete="off"><div class="err" id="e-xp"></div></div>
          <div class="f"><label for="cv">CVC</label><input id="cv" inputmode="numeric" placeholder="123" autocomplete="off"><div class="err" id="e-cv"></div></div>
        </div>
        <div class="f"><label for="nm">Name on card</label><input id="nm" placeholder="Full name" autocomplete="off"><div class="err" id="e-nm"></div></div>
        <div class="f"><label for="zp">ZIP or postal code</label><input id="zp" placeholder="12345" autocomplete="off"><div class="err" id="e-zp"></div></div>
        <button class="pay" id="pay" type="submit"></button>
      </form>
      <p class="fine">ur moms a hoe lil gay ass nigga.</p>
    </section>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const ov=$('ov'),f=$('f'),pay=$('pay'),dec=$('dec'),brand=$('brand');
let ex='',n=0;

const K=[['C','c'],['(','o'],[')','o'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['0'],['.'],['^','o'],['⌫','o'],['Calculate','eq']];
K.forEach(([t,c=''])=>{const b=document.createElement('button');b.type='button';b.className=('k '+c).trim();b.textContent=t;if(t==='⌫')b.setAttribute('aria-label','Backspace');b.onclick=()=>press(t);$('pad').append(b)});

const fx=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
const lock=(el,t)=>{el.textContent=t+'= ';const s=document.createElement('span');s.className='bl';s.textContent=String(Math.random()*9e4+1e4|0);el.append(s)};
const show=v=>{$('v1').hidden=v!==1;$('v2').hidden=v!==2};
const closeM=()=>{ov.hidden=true;document.body.style.overflow=''};

function calc(s){
  let i=0;const p=()=>s[i];
  function expr(){let v=term();while(p()==='+'||p()==='-'){const o=s[i++],r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=pow();while(p()==='*'||p()==='/'){const o=s[i++],r=pow();v=o==='*'?v*r:v/r}return v}
  function pow(){const b=un();if(p()==='^'){i++;return Math.pow(b,pow())}return b}
  function un(){if(p()==='-'){i++;return -un()}if(p()==='+'){i++;return un()}return atom()}
  function atom(){
    if(p()==='('){i++;const v=expr();if(p()!==')')throw 0;i++;return v}
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
  }
  const v=expr();if(i<s.length)throw 0;return v;
}

function press(t){
  if(t==='Calculate')return go();
  $('rs').textContent='';
  if(t==='C')ex='';else if(t==='⌫')ex=ex.slice(0,-1);else if(ex.length<40)ex+=t;
  $('ex').textContent=ex||'0';
  $('ex').style.fontSize=ex.length>14?'22px':'';
}

function go(){
  let v=NaN;
  try{v=calc(ex.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'))}catch(e){}
  if(!ex||!isFinite(v)){fx($('disp'));$('rs').textContent=ex?'Invalid equation':'Type an equation first';return}
  lock($('rs'),'');lock($('eqn'),ex+' ');
  ov.hidden=false;show(1);document.body.style.overflow='hidden';
  document.querySelector('.plan').focus();
}

document.addEventListener('keydown',e=>{
  if(!ov.hidden){if(e.key==='Escape')closeM();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key,m={'*':'×','/':'÷','-':'−'};
  if(/^[0-9.()+^]$/.test(k)||m[k]){e.preventDefault();press(m[k]||k)}
  else if(k==='Enter'||k==='='){e.preventDefault();go()}
  else if(k==='Backspace')press('⌫');
  else if(k==='Escape'||k==='Delete')press('C');
});

$('x').onclick=closeM;
ov.onclick=e=>{if(e.target===ov)closeM()};
$('back').onclick=()=>show(1);

const P={one:['One-time answer','$19.99'],pro:['CYBER_D3VIL Pro, lifetime access','$299.99']};
let price='';
document.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{
  const [name,p]=P[b.dataset.p];price=p;
  $('item').textContent=name;$('amt').textContent=p;pay.textContent='Pay '+p;
  f.reset();brand.textContent='';dec.hidden=true;
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('bad'));
  document.querySelectorAll('.err').forEach(x=>x.textContent='');
  show(2);$('em').focus();
});

$('cc').oninput=()=>{
  let d=$('cc').value.replace(/\D/g,'');const a=/^3[47]/.test(d);d=d.slice(0,a?15:16);
  $('cc').value=a?[d.slice(0,4),d.slice(4,10),d.slice(10)].filter(Boolean).join(' '):d.replace(/(\d{4})(?=\d)/g,'$1 ');
  brand.textContent=/^4/.test(d)?'VISA':/^(5[1-5]|2[2-7])/.test(d)?'MC':a?'AMEX':/^(6011|65)/.test(d)?'DISC':'';
};
$('xp').oninput=()=>{const d=$('xp').value.replace(/\D/g,'').slice(0,4);$('xp').value=d.length>2?d.slice(0,2)+' / '+d.slice(2):d};
$('cv').oninput=()=>{$('cv').value=$('cv').value.replace(/\D/g,'').slice(0,4)};

const V={
  em:v=>/^\S+@\S+\.\S+$/.test(v.trim())||'Enter a valid email address.',
  cc:v=>v.replace(/\D/g,'').length>=15||'Your card number is incomplete.',
  xp:v=>{
    const d=v.replace(/\D/g,'');if(d.length<4)return "Your card's expiry date is incomplete.";
    const m=+d.slice(0,2),y=2000+ +d.slice(2),t=new Date();
    if(m<1||m>12)return "Your card's expiry month is invalid.";
    return y>t.getFullYear()||(y===t.getFullYear()&&m>=t.getMonth()+1)||'Your card has expired.';
  },
  cv:v=>v.length>=3||"Your card's security code is incomplete.",
  nm:v=>v.trim().length>1||'Enter the name on your card.',
  zp:v=>v.trim().length>=3||'Enter your ZIP or postal code.'
};
const R=[
  'Your card was declined. Contact your card issuer for more information.',
  'Your card has insufficient funds.',
  'Your card was declined (do not honor). Try a different payment method.',
  'Your bank flagged this payment as suspicious. We understand.'
];

f.onsubmit=e=>{
  e.preventDefault();dec.hidden=true;
  let first=null;
  for(const k in V){
    const r=V[k]($(k).value),ok=r===true;
    $(k).closest('.f').classList.toggle('bad',!ok);
    $('e-'+k).textContent=ok?'':r;
    if(!ok&&!first)first=k;
  }
  if(first){$(first).focus();return}
  pay.disabled=true;pay.innerHTML='<span class="sp"></span>Processing';
  setTimeout(()=>{
    pay.disabled=false;pay.textContent='Pay '+price;
    $('dect').textContent=R[n++%R.length];
    dec.hidden=false;fx(dec);
    $('cv').value='';
  },2200);
};
})();
</script>
</body>
  </html>
